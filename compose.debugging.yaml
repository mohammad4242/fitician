# Optional workers. Supply a tested image and dedicated secret configuration explicitly.
# This overlay does not enable production CD or start execution/deployment tools.
services:
  debug-worker:
    image: ${FITICIAN_DEBUG_IMAGE:?Set the tested backend image digest}
    profiles: [diagnostics-debug]
    command: [python, -m, app.debugging.worker]
    env_file:
      - path: ${FITICIAN_DEBUG_ENV_FILE:?Set a dedicated worker configuration file}
        format: raw
    environment:
      DIAGNOSTICS_ENVIRONMENT: ${DIAGNOSTICS_ENVIRONMENT:-}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: '2'}
    tmpfs: [/run/fitician:mode=1777]
    networks: [application]
    healthcheck:
      test: [CMD, python, -m, app.jobs.heartbeat, --service, debug-worker]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s
  diagnostics-sync-worker:
    image: ${FITICIAN_DEBUG_IMAGE:?Set the tested backend image digest}
    profiles: [diagnostics-debug]
    command: [python, -m, app.observability.sentry_sync]
    env_file:
      - path: ${FITICIAN_SYNC_ENV_FILE:-${FITICIAN_DEBUG_ENV_FILE:?Set a dedicated worker configuration file}}
        format: raw
    environment:
      DIAGNOSTICS_ENVIRONMENT: ${DIAGNOSTICS_ENVIRONMENT:-}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: '2'}
    tmpfs: [/run/fitician:mode=1777]
    networks: [application]
    healthcheck:
      test: [CMD, python, -m, app.jobs.heartbeat, --service, diagnostics-sync-worker]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s
  diagnostics-alert-worker:
    image: ${FITICIAN_DEBUG_IMAGE:?Set the tested backend image digest}
    profiles: [diagnostics-alerts]
    stop_grace_period: 25s
    command: [python, -m, app.observability.alert_worker]
    # An absent file cannot enable sending; the worker requires explicit enablement/time.
    env_file:
      - path: ${FITICIAN_ALERT_ENV_FILE:-/dev/null}
        format: raw
    environment:
      DIAGNOSTICS_ENVIRONMENT: ${DIAGNOSTICS_ENVIRONMENT:-}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: '2'}
    tmpfs: [/run/fitician:mode=1777]
    networks: [application]
    healthcheck:
      test: [CMD, python, -m, app.jobs.heartbeat, --service, diagnostics-alert-worker]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s
networks:
  application:
    external: true
    name: ${FITICIAN_DEBUG_NETWORK:?Set the existing application network}
