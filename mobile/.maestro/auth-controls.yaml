- tapOn: "ساخت حساب و ذخیره پاسخ‌ها"
- scrollUntilVisible:
    element: "ساخت حساب و ذخیره پاسخ‌ها"
    visibilityPercentage: 100
- hideKeyboard
- scrollUntilVisible:
    element: "شماره تلفن"
    direction: UP
