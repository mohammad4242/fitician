services:
  hostdev-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: fitician
      POSTGRES_PASSWORD: fitician
      POSTGRES_DB: fitician
    ports:
      - "5433:5432"
    volumes:
      - fitician_hostdev_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitician -d fitician"]
      interval: 2s
      timeout: 5s
      retries: 30

  hostdev-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    init: true
    environment:
      VITE_API_PROXY_TARGET: http://host.docker.internal:8002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - fitician_hostdev_frontend_node_modules:/app/node_modules

volumes:
  fitician_hostdev_postgres_data:
  fitician_hostdev_frontend_node_modules:
