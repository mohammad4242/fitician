name: Fitician Frontend Only CI

on:
  workflow_call:
    inputs:
      core_artifact:
        type: string
        default: ''
      called_by_router:
        type: boolean
        default: false
      publish_image:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the verified frontend image to production
        required: false
        type: boolean
        default: false
      previous_image_tag:
        description: Current immutable production image tag for rollback
        required: false
        type: string

permissions:
  contents: read

jobs:
  manual-scope:
    if: github.event_name == 'workflow_dispatch' && !inputs.called_by_router
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require safe frontend source changes
        run: |
          python3 ops/ci-classify.py --base "${GITHUB_SHA}^" --output .ci-evidence/manual-plan.json
          python3 - <<'PY'
          import json
          plan = json.load(open('.ci-evidence/manual-plan.json'))
          if plan['path'] != 'frontend':
              raise SystemExit('Use Full CI for this SHA; manual frontend releases require safe frontend-only changes')
          PY
      - name: Scan manual release for secrets
        run: npm run security:secrets
  frontend-verification:
    name: Frontend verification
    needs: manual-scope
    if: always() && !cancelled() && (needs.manual-scope.result == 'success' || needs.manual-scope.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        if: inputs.core_artifact != ''
        with:
          name: ${{ inputs.core_artifact }}
          path: packages/fitician-core/dist
      - run: npm run build:core
        if: inputs.core_artifact == ''
      - run: npm run test --workspace frontend
      - run: npm run lint --workspace frontend
      - run: npm run build --workspace frontend

  frontend-image:
    name: Build, verify, and push frontend image
    if: inputs.publish_image || (github.event_name == 'workflow_dispatch' && !inputs.called_by_router)
    needs: frontend-verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Require public S3 media URL
        env:
          MEDIA_BASE: ${{ vars.VITE_MEDIA_PUBLIC_BASE_URL }}
        run: |
          case "$MEDIA_BASE" in
            https://*) ;;
            *) echo "VITE_MEDIA_PUBLIC_BASE_URL must be an HTTPS bucket base URL" >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error --head --max-time 20 \
            "${MEDIA_BASE%/}/public/landing/videos/landfilm.mp4" >/dev/null
      - name: Mask Google web client ID
        env:
          GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: echo "::add-mask::$GOOGLE_CLIENT_ID"
      - name: Require Google web client ID
        env:
          GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$(printf '%s' "$GOOGLE_CLIENT_ID" | tr -d '[:space:]')" ]; then
            echo "VITE_GOOGLE_CLIENT_ID is required for production Google Sign-In" >&2
            exit 1
          fi
          case "$GOOGLE_CLIENT_ID" in
            *.apps.googleusercontent.com) ;;
            *)
              echo "VITE_GOOGLE_CLIENT_ID must look like a Google OAuth client ID" >&2
              exit 1
              ;;
          esac
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build frontend image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          load: true
          build-args: |
            VITE_MEDIA_PUBLIC_BASE_URL=${{ vars.VITE_MEDIA_PUBLIC_BASE_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fitician-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fitician-frontend:main
          cache-from: type=gha,scope=fitician-frontend
          cache-to: type=gha,mode=max,scope=fitician-frontend
      - name: Check built frontend image contents
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
          EXPECTED_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          docker run --rm --entrypoint sh -e EXPECTED_GOOGLE_CLIENT_ID \
            -e 'EXPECTED_ENAMAD_META_TAG=<meta name="enamad" content="74257848" />' \
            "$DOCKERHUB_USERNAME/fitician-frontend:$IMAGE_TAG" -c '
              test -f /usr/share/nginx/html/index.html
              test "$(grep -F -o -- "$EXPECTED_ENAMAD_META_TAG" /usr/share/nginx/html/index.html | wc -l)" -eq 1
              test -f /usr/share/nginx/html/exercises/exercise-placeholder.svg
              test -f /usr/share/nginx/html/pwa/icon-192.png
              test ! -e /usr/share/nginx/html/image\&videos/landing.mp4
              grep -R -F -- "$EXPECTED_GOOGLE_CLIENT_ID" /usr/share/nginx/html/assets >/dev/null
            '
      - name: Push verified frontend image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$DOCKERHUB_USERNAME/fitician-frontend:$IMAGE_TAG"
          docker push "$DOCKERHUB_USERNAME/fitician-frontend:main"

  deploy-frontend-production:
    if: github.event_name == 'workflow_dispatch' && !inputs.called_by_router && inputs.deploy_production && github.ref == 'refs/heads/main'
    needs: frontend-image
    uses: ./.github/workflows/deploy-component.yml
    with:
      component: frontend
      image_tag: ${{ github.sha }}
      previous_image_tag: ${{ inputs.previous_image_tag || '' }}
    secrets: inherit
