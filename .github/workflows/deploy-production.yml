name: Deploy Fitician production

on:
  workflow_run:
    workflows: [Fitician CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable Git SHA image tag to deploy
        required: true
        type: string
      previous_image_tag:
        description: Previous immutable tag used for rollback
        required: false
        type: string
      initial_deploy:
        description: First deployment after the existing database is restored
        required: false
        type: boolean
        default: false
      allow_schema_migrations:
        description: Run a reviewed schema migration after an encrypted backup
        required: false
        type: boolean
        default: false
      first_scalability_release_approved:
        description: Approve the first scalability rollout after reviewing all acceptance evidence
        required: false
        type: boolean
        default: false
      heavy_evidence_run_id:
        description: Successful recent Fitician local scalability checks run for this exact SHA
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: fitician-production
  queue: max

jobs:
  automatic_images_gate:
    name: Confirm immutable images were published
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      images_ready: ${{ steps.inspect-images.outputs.ready }}
    steps:
      - name: Inspect image job in this exact CI run
        id: inspect-images
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          image_conclusions="$(gh api \
            --paginate \
            --jq '.jobs[] | select(.name == "Build and publish immutable production images") | .conclusion' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/jobs?per_page=100&filter=latest")"
          if printf '%s\n' "$image_conclusions" | grep -Fxq success; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'The CI run did not publish immutable production images; automatic deployment is skipped.'
          fi

  automatic_deploy_gate:
    name: Check automatic first scalability gate
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      needs.automatic_images_gate.outputs.images_ready == 'true'
    needs: automatic_images_gate
    runs-on: ubuntu-latest
    environment: production
    outputs:
      deploy: ${{ steps.check-marker.outputs.deploy }}
    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Pin VPS host key
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Validate VPS marker target
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR || secrets.VPS_APP_DIR || '/opt/fitician' }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          printf '%s' "$VPS_APP_DIR" | grep -Eq '^/[A-Za-z0-9._/-]+$'

      - name: Check scalability acceptance marker
        id: check-marker
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR || secrets.VPS_APP_DIR || '/opt/fitician' }}
        run: |
          set +e
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "test -f '$VPS_APP_DIR/.scalability-foundation-accepted'"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 1 ]; then
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'First scalability release is not approved; automatic deployment is skipped.'
          else
            echo "Unable to inspect the scalability acceptance marker (ssh status $status)" >&2
            exit "$status"
          fi

  deploy:
    name: Deploy immutable images to VPS
    needs: [automatic_images_gate, automatic_deploy_gate]
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        needs.automatic_images_gate.result == 'success' &&
        needs.automatic_images_gate.outputs.images_ready == 'true' &&
        needs.automatic_deploy_gate.result == 'success' &&
        needs.automatic_deploy_gate.outputs.deploy == 'true'))
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.image_tag }}
      PREVIOUS_IMAGE_TAG: ${{ inputs.previous_image_tag || '' }}
      INITIAL_DEPLOY: ${{ inputs.initial_deploy || 'false' }}
      ALLOW_SCHEMA_MIGRATIONS: ${{ inputs.allow_schema_migrations || 'false' }}
      FIRST_SCALABILITY_RELEASE_APPROVED: ${{ inputs.first_scalability_release_approved || 'false' }}
      SCALABILITY_EVIDENCE_RUN_ID: ${{ inputs.heavy_evidence_run_id || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Verify first scalability acceptance evidence
        if: github.event_name == 'workflow_dispatch' && inputs.first_scalability_release_approved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$SCALABILITY_EVIDENCE_RUN_ID" | grep -Eq '^[0-9]+$'
          repository="repos/${GITHUB_REPOSITORY}"
          workflow_name=$(gh api "$repository/actions/runs/$SCALABILITY_EVIDENCE_RUN_ID" --jq '.name')
          conclusion=$(gh api "$repository/actions/runs/$SCALABILITY_EVIDENCE_RUN_ID" --jq '.conclusion')
          evidence_sha=$(gh api "$repository/actions/runs/$SCALABILITY_EVIDENCE_RUN_ID" --jq '.head_sha')
          created_at=$(gh api "$repository/actions/runs/$SCALABILITY_EVIDENCE_RUN_ID" --jq '.created_at')
          test "$workflow_name" = "Fitician local scalability checks"
          test "$conclusion" = success
          test "$evidence_sha" = "$IMAGE_TAG"
          python3 - "$created_at" <<'PY'
          from datetime import UTC, datetime, timedelta
          import sys

          created = datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))
          if created < datetime.now(UTC) - timedelta(days=14):
              raise SystemExit("Heavy scalability evidence is older than 14 days")
          PY
          gh api "$repository/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=100" \
            --jq '.workflow_runs[].head_sha' | grep -Fx "$IMAGE_TAG"

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Pin VPS host key
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Validate deployment inputs
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR || secrets.VPS_APP_DIR || '/opt/fitician' }}
        run: |
          printf '%s' "$IMAGE_TAG" | grep -Eq '^[0-9a-f]{40}$'
          if [ -n "$PREVIOUS_IMAGE_TAG" ]; then
            printf '%s' "$PREVIOUS_IMAGE_TAG" | grep -Eq '^[0-9a-f]{40}$'
          fi
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          printf '%s' "$VPS_APP_DIR" | grep -Eq '^/[A-Za-z0-9._/-]+$'

      - name: Authenticate VPS Docker client
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_TOKEN" | ssh "$VPS_USER@$VPS_HOST" \
            "docker login --username '$DOCKERHUB_USERNAME' --password-stdin"

      - name: Copy deployment contract
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR || secrets.VPS_APP_DIR || '/opt/fitician' }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$VPS_APP_DIR/ops/redis'; if [ -f '$VPS_APP_DIR/compose.prod.yaml' ]; then cp '$VPS_APP_DIR/compose.prod.yaml' '$VPS_APP_DIR/.compose.prod.rollback.yaml'; else rm -f '$VPS_APP_DIR/.compose.prod.rollback.yaml'; fi"
          scp compose.prod.yaml "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/compose.prod.yaml"
          scp Caddyfile "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/Caddyfile"
          scp ops/redis/redis.conf "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/ops/redis/redis.conf"
          scp ops/backup-production.sh "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/backup-production.sh"
          scp ops/check-db-connection-budget.py "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/ops/check-db-connection-budget.py"
          scp ops/check-runtime-capacity.py "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/ops/check-runtime-capacity.py"
          scp ops/verify-production.sh "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/ops/verify-production.sh"
          scp ops/deploy-production.sh "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/.deploy-production.sh"

      - name: Pull, migrate, health-check, and rollback on failure
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR || secrets.VPS_APP_DIR || '/opt/fitician' }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "set -e; trap 'rm -f \"$VPS_APP_DIR/.deploy-production.sh\"' EXIT; IMAGE_TAG='$IMAGE_TAG' PREVIOUS_IMAGE_TAG='$PREVIOUS_IMAGE_TAG' INITIAL_DEPLOY='$INITIAL_DEPLOY' ALLOW_SCHEMA_MIGRATIONS='$ALLOW_SCHEMA_MIGRATIONS' FIRST_SCALABILITY_RELEASE_APPROVED='$FIRST_SCALABILITY_RELEASE_APPROVED' SCALABILITY_EVIDENCE_RUN_ID='$SCALABILITY_EVIDENCE_RUN_ID' COMPOSE_FILE='$VPS_APP_DIR/compose.prod.yaml' ROLLBACK_COMPOSE_FILE='$VPS_APP_DIR/.compose.prod.rollback.yaml' sh '$VPS_APP_DIR/.deploy-production.sh'"
