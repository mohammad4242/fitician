name: Public SEO delivery
on:
  pull_request:
    paths: ['frontend/**', 'packages/fitician-core/**', 'backend/app/exercises/seed_data.py', 'backend/app/exercises/curated_safety_notes.py', 'backend/app/exercises/enums.py', 'backend/app/exercises/media_metadata.py', 'package*.json', '.dockerignore', '.github/workflows/public-seo.yml']
  push:
    branches: [main, feat/public-seo]
    paths: ['frontend/**', 'packages/fitician-core/**', 'backend/app/exercises/seed_data.py', 'backend/app/exercises/curated_safety_notes.py', 'backend/app/exercises/enums.py', 'backend/app/exercises/media_metadata.py', 'package*.json', '.dockerignore', '.github/workflows/public-seo.yml']
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --workspace frontend --workspace @fitician/core --include-workspace-root
      - run: npm run build:core
      - run: npm exec --workspace frontend -- playwright install --with-deps chromium webkit
      - run: npm run test:seo --workspace frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: public-seo-browser-failures
          path: frontend/test-results/
