name: Deploy Fitician regional production

on:
  workflow_dispatch:
    inputs:
      target:
        description: Production region
        required: true
        type: choice
        options: [iran, germany]
      deploy_kind:
        description: Iran release scope or Germany Agent Service release
        required: true
        type: choice
        options: [full, frontend, backend, agent]
      image_tag:
        description: Immutable Git SHA image tag
        required: true
        type: string
      ci_run_id:
        description: Successful exact-SHA validation run (Full CI for full/agent; component CI for frontend/backend)
        required: true
        type: string
      owner_approved:
        description: Explicit owner approval for this regional deployment
        required: true
        type: boolean
        default: false
      allow_schema_migrations:
        description: Approve reviewed schema migration on Iran full release
        required: false
        type: boolean
        default: false
      initial_deploy:
        description: Approve the region-specific initial adoption/bootstrap path
        required: false
        type: boolean
        default: false
      frontend_contract_refresh:
        description: Protected frontend-only refresh after the live APIs already adopted the generated contract
        required: false
        type: boolean
        default: false
      image_source:
        description: Pull immutable images from registry or use preloaded local images
        required: true
        type: choice
        options: [registry, preloaded]
        default: registry
      first_scalability_release_approved:
        description: Approve first Iran rollout after reviewing scalability acceptance evidence
        required: false
        type: boolean
        default: false
      scalability_evidence_run_id:
        description: Successful recent local scalability checks run for this exact SHA
        required: false
        type: string
  workflow_run:
    workflows: [Fitician CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  normalize-request:
    name: Normalize and validate release request
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      vars.REGIONAL_CD_ENABLED == 'true' && vars.REGIONAL_AUTO_CD_ENABLED == 'true')
    runs-on: ubuntu-latest
    outputs:
      target: ${{ github.event_name == 'workflow_dispatch' && steps.manual.outputs.target || steps.automatic.outputs.target }}
      deploy_kind: ${{ github.event_name == 'workflow_dispatch' && steps.manual.outputs.deploy_kind || steps.automatic.outputs.deploy_kind }}
      image_tag: ${{ github.event_name == 'workflow_dispatch' && steps.manual.outputs.image_tag || steps.automatic.outputs.image_tag }}
      ci_run_id: ${{ github.event_name == 'workflow_dispatch' && steps.manual.outputs.ci_run_id || steps.automatic.outputs.ci_run_id }}
      owner_approved: ${{ github.event_name == 'workflow_dispatch' && steps.manual.outputs.owner_approved || steps.automatic.outputs.owner_approved }}
      allow_schema_migrations: ${{ github.event_name == 'workflow_dispatch' && steps.manual.outputs.allow_schema_migrations || steps.automatic.outputs.allow_schema_migrations }}
      initial_deploy: ${{ github.event_name == 'workflow_dispatch' && steps.manual.outputs.initial_deploy || steps.automatic.outputs.initial_deploy }}
      frontend_contract_refresh: ${{ github.event_name == 'workflow_dispatch' && steps.manual.outputs.frontend_contract_refresh || 'false' }}
      first_scalability_release_approved: ${{ github.event_name == 'workflow_dispatch' && steps.manual.outputs.first_scalability_release_approved || steps.automatic.outputs.first_scalability_release_approved }}
      scalability_evidence_run_id: ${{ github.event_name == 'workflow_dispatch' && steps.manual.outputs.scalability_evidence_run_id || steps.automatic.outputs.scalability_evidence_run_id }}
      image_source: ${{ github.event_name == 'workflow_dispatch' && steps.manual.outputs.image_source || steps.automatic.outputs.image_source }}
      auto_release: ${{ github.event_name == 'workflow_dispatch' && steps.manual.outputs.auto_release || steps.automatic.outputs.auto_release }}
      skip_release: ${{ github.event_name == 'workflow_dispatch' && steps.manual.outputs.skip_release || steps.automatic.outputs.skip_release }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_run'
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - name: Copy manual dispatch inputs
        id: manual
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET: ${{ inputs.target }}
          DEPLOY_KIND: ${{ inputs.deploy_kind }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          OWNER_APPROVED: ${{ inputs.owner_approved }}
          ALLOW_SCHEMA_MIGRATIONS: ${{ inputs.allow_schema_migrations }}
          INITIAL_DEPLOY: ${{ inputs.initial_deploy }}
          FRONTEND_CONTRACT_REFRESH: ${{ inputs.frontend_contract_refresh }}
          FIRST_SCALABILITY_RELEASE_APPROVED: ${{ inputs.first_scalability_release_approved }}
          SCALABILITY_EVIDENCE_RUN_ID: ${{ inputs.scalability_evidence_run_id }}
          IMAGE_SOURCE: ${{ inputs.image_source }}
        run: |
          set -euo pipefail
          [[ "$TARGET" == iran || "$TARGET" == germany ]]
          [[ "$DEPLOY_KIND" == full || "$DEPLOY_KIND" == frontend || "$DEPLOY_KIND" == backend || "$DEPLOY_KIND" == agent ]]
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          [[ -z "$SCALABILITY_EVIDENCE_RUN_ID" || "$SCALABILITY_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$IMAGE_SOURCE" == registry || "$IMAGE_SOURCE" == preloaded ]]
          for flag in "$OWNER_APPROVED" "$ALLOW_SCHEMA_MIGRATIONS" "$INITIAL_DEPLOY" "$FRONTEND_CONTRACT_REFRESH" "$FIRST_SCALABILITY_RELEASE_APPROVED"; do
            [[ "$flag" == true || "$flag" == false ]]
          done
          for pair in \
            "target=$TARGET" "deploy_kind=$DEPLOY_KIND" "image_tag=$IMAGE_TAG" \
            "ci_run_id=$CI_RUN_ID" "owner_approved=$OWNER_APPROVED" \
            "allow_schema_migrations=$ALLOW_SCHEMA_MIGRATIONS" \
            "initial_deploy=$INITIAL_DEPLOY" \
            "frontend_contract_refresh=$FRONTEND_CONTRACT_REFRESH" \
            "first_scalability_release_approved=$FIRST_SCALABILITY_RELEASE_APPROVED" \
            "scalability_evidence_run_id=$SCALABILITY_EVIDENCE_RUN_ID" \
            "image_source=$IMAGE_SOURCE" "auto_release=false" "skip_release=false"; do
            echo "$pair" >> "$GITHUB_OUTPUT"
          done
      - name: Validate canonical completed main CI and select automatic scope
        id: automatic
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 ops/ci-auto-release.py --run-id "$CI_RUN_ID"

  verify-release:
    name: Verify exact-SHA CI evidence
    needs: normalize-request
    if: needs.normalize-request.outputs.skip_release != 'true'
    runs-on: ubuntu-latest
    outputs:
      backend_tests: ${{ steps.release.outputs.backend_tests }}
      release_path: ${{ steps.release.outputs.release_path }}
      shared_validated: ${{ steps.release.outputs.shared_validated }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.normalize-request.outputs.image_tag }}
          fetch-depth: 0
      - name: Validate owner choice and target combination
        env:
          TARGET: ${{ needs.normalize-request.outputs.target }}
          DEPLOY_KIND: ${{ needs.normalize-request.outputs.deploy_kind }}
          OWNER_APPROVED: ${{ needs.normalize-request.outputs.owner_approved }}
          IMAGE_TAG: ${{ needs.normalize-request.outputs.image_tag }}
          CI_RUN_ID: ${{ needs.normalize-request.outputs.ci_run_id }}
          INITIAL_DEPLOY: ${{ needs.normalize-request.outputs.initial_deploy }}
          FRONTEND_CONTRACT_REFRESH: ${{ needs.normalize-request.outputs.frontend_contract_refresh }}
          ALLOW_SCHEMA_MIGRATIONS: ${{ needs.normalize-request.outputs.allow_schema_migrations }}
          FIRST_SCALABILITY_RELEASE_APPROVED: ${{ needs.normalize-request.outputs.first_scalability_release_approved }}
          SCALABILITY_EVIDENCE_RUN_ID: ${{ needs.normalize-request.outputs.scalability_evidence_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$OWNER_APPROVED" = true
          if [ "$FRONTEND_CONTRACT_REFRESH" = true ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$TARGET:$DEPLOY_KIND" = iran:frontend
            test "$INITIAL_DEPLOY" = false
            test "$ALLOW_SCHEMA_MIGRATIONS" = false
          fi
          printf '%s' "$IMAGE_TAG" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$CI_RUN_ID" | grep -Eq '^[0-9]+$'
          if [ "$TARGET" = iran ]; then
            test "$DEPLOY_KIND" = full || test "$DEPLOY_KIND" = frontend || test "$DEPLOY_KIND" = backend
            if [ "$INITIAL_DEPLOY" = true ]; then
              test "$DEPLOY_KIND" = full
              test "$FIRST_SCALABILITY_RELEASE_APPROVED" = true
              printf '%s' "$SCALABILITY_EVIDENCE_RUN_ID" | grep -Eq '^[0-9]+$'
            fi
          else
            test "$TARGET" = germany
            test "$DEPLOY_KIND" = agent
            test "$FIRST_SCALABILITY_RELEASE_APPROVED" = false
          fi
          test "$(git rev-parse HEAD)" = "$IMAGE_TAG"
      - name: Verify first Iran scalability evidence
        if: needs.normalize-request.outputs.target == 'iran' && needs.normalize-request.outputs.initial_deploy == 'true' && needs.normalize-request.outputs.first_scalability_release_approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ needs.normalize-request.outputs.image_tag }}
          SCALABILITY_EVIDENCE_RUN_ID: ${{ needs.normalize-request.outputs.scalability_evidence_run_id }}
        run: |
          set -euo pipefail
          PYTHONPATH=ops python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "register_regional_runtime", Path("ops/register-regional-runtime.py")
          )
          if spec is None or spec.loader is None:
              raise SystemExit("Unable to load regional evidence validator")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          module.load_foundation_evidence(
              os.environ["GITHUB_REPOSITORY"],
              int(os.environ["SCALABILITY_EVIDENCE_RUN_ID"]),
              os.environ["IMAGE_TAG"],
          )
          PY
      - name: Require successful exact-SHA CI evidence and published images
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ needs.normalize-request.outputs.image_tag }}
          CI_RUN_ID: ${{ needs.normalize-request.outputs.ci_run_id }}
          TARGET: ${{ needs.normalize-request.outputs.target }}
          DEPLOY_KIND: ${{ needs.normalize-request.outputs.deploy_kind }}
          FRONTEND_CONTRACT_REFRESH: ${{ needs.normalize-request.outputs.frontend_contract_refresh }}
        run: |
          set -euo pipefail
          mkdir -p .ci-evidence/regional
          if [ "$FRONTEND_CONTRACT_REFRESH" = true ]; then
            python3 ops/ci-release-gate.py --run-id "$CI_RUN_ID" --sha "$IMAGE_TAG" \
              --require-full --directory .ci-evidence/regional
          else
          case "$DEPLOY_KIND" in
            full|agent) python3 ops/ci-release-gate.py --run-id "$CI_RUN_ID" --sha "$IMAGE_TAG" \
              --require-full --directory .ci-evidence/regional ;;
            frontend|backend) python3 ops/ci-release-gate.py --run-id "$CI_RUN_ID" --sha "$IMAGE_TAG" \
              --directory .ci-evidence/regional ;;
          esac
          fi
          plan=.ci-evidence/regional/release-plan.json
          release_path=$(sed -n 's/^release_path=//p' "$GITHUB_OUTPUT" | tail -n 1)
          test -n "$release_path"
          python3 - "$plan" "$TARGET" "$DEPLOY_KIND" "$release_path" "$FRONTEND_CONTRACT_REFRESH" <<'PY'
          import json
          import sys

          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          target, kind, path, refresh = sys.argv[2:]
          allowed = (
              target == "iran"
              and kind == "frontend"
              and plan.get("deploy_frontend")
              and (path in {"component", "frontend-full"}
                   or refresh == "true" and path in {"full", "selective"})
          ) or (
              target == "iran"
              and kind == "backend"
              and plan.get("deploy_backend")
              and path == "component"
          ) or (
              kind == "full" and path == "full"
          ) or (
              target == "germany"
              and kind == "agent"
              and plan.get("deploy_agent")
              and path in {"full", "selective"}
          )
          if not allowed:
              raise SystemExit("Exact CI release evidence does not authorize this regional component")
          PY
          backend_tests=$(python3 -c 'import json; from pathlib import Path; print(json.dumps(json.loads(Path(".ci-evidence/regional/release-plan.json").read_text()).get("backend_tests", []), separators=(",", ":")))')
          shared_validated=$(python3 -c 'import json; from pathlib import Path; print(str(bool(json.loads(Path(".ci-evidence/regional/release-plan.json").read_text()).get("run_shared"))).lower())')
          echo "backend_tests=$backend_tests" >> "$GITHUB_OUTPUT"
          echo "shared_validated=$shared_validated" >> "$GITHUB_OUTPUT"

  owner-approval:
    name: Owner approval for full regional release
    if: >-
      github.event_name == 'workflow_dispatch' &&
      vars.REGIONAL_CD_ENABLED == 'true' &&
      needs.verify-release.result == 'success' &&
      (needs.normalize-request.outputs.deploy_kind == 'full' ||
      needs.normalize-request.outputs.deploy_kind == 'agent' ||
      needs.normalize-request.outputs.frontend_contract_refresh == 'true')
    needs: [normalize-request, verify-release]
    runs-on: ubuntu-latest
    environment: production-owner-approval
    steps:
      - name: Record protected owner approval
        run: echo 'Protected owner approval granted for this regional release.'

  deploy:
    name: Deploy ${{ needs.normalize-request.outputs.deploy_kind }} to ${{ needs.normalize-request.outputs.target }}
    needs: [normalize-request, verify-release, owner-approval]
    if: >-
      always() &&
      !cancelled() &&
      ((github.event_name == 'workflow_dispatch' &&
      vars.REGIONAL_CD_ENABLED == 'true') ||
      (github.event_name == 'workflow_run' &&
      vars.REGIONAL_CD_ENABLED == 'true' && vars.REGIONAL_AUTO_CD_ENABLED == 'true')) &&
      github.ref == 'refs/heads/main' &&
      needs.verify-release.result == 'success' &&
      (needs.normalize-request.outputs.auto_release == 'true' ||
      (needs.normalize-request.outputs.deploy_kind != 'full' &&
      needs.normalize-request.outputs.deploy_kind != 'agent' &&
      needs.normalize-request.outputs.frontend_contract_refresh != 'true') ||
      needs['owner-approval'].result == 'success')
    runs-on: ubuntu-latest
    environment: ${{ needs.normalize-request.outputs.target == 'iran' && 'production-iran' || 'production-germany' }}
    concurrency:
      group: fitician-production-${{ needs.normalize-request.outputs.target }}
      cancel-in-progress: false
    env:
      TARGET: ${{ needs.normalize-request.outputs.target }}
      DEPLOY_KIND: ${{ needs.normalize-request.outputs.deploy_kind }}
      IMAGE_TAG: ${{ needs.normalize-request.outputs.image_tag }}
      OWNER_APPROVED: ${{ needs.normalize-request.outputs.owner_approved }}
      ALLOW_SCHEMA_MIGRATIONS: ${{ needs.normalize-request.outputs.allow_schema_migrations }}
      INITIAL_DEPLOY: ${{ needs.normalize-request.outputs.initial_deploy }}
      FIRST_SCALABILITY_RELEASE_APPROVED: ${{ needs.normalize-request.outputs.first_scalability_release_approved }}
      SCALABILITY_EVIDENCE_RUN_ID: ${{ needs.normalize-request.outputs.scalability_evidence_run_id }}
      IMAGE_SOURCE: ${{ needs.normalize-request.outputs.image_source }}
      CI_BACKEND_TESTS: ${{ needs.verify-release.outputs.backend_tests }}
      CI_RELEASE_PATH: ${{ needs.verify-release.outputs.release_path }}
      CI_SHARED_VALIDATED: ${{ needs.verify-release.outputs.shared_validated }}
      CI_RUN_ID: ${{ needs.normalize-request.outputs.ci_run_id }}
      FRONTEND_CONTRACT_REFRESH: ${{ needs.normalize-request.outputs.frontend_contract_refresh }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
      COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '9011' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.normalize-request.outputs.image_tag }}
          fetch-depth: 0
      - name: Revalidate automatic main SHA before exposing deployment credentials
        if: needs.normalize-request.outputs.auto_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ needs.normalize-request.outputs.ci_run_id }}
          IMAGE_TAG: ${{ needs.normalize-request.outputs.image_tag }}
        run: python3 ops/ci-auto-release.py --recheck-current-main --run-id "$CI_RUN_ID" --sha "$IMAGE_TAG"
      - name: Validate regional deployment settings
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          printf '%s' "$VPS_HOST" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9.-]*$'
          printf '%s' "$VPS_USER" | grep -Eq '^[A-Za-z0-9._-]+$'
          printf '%s' "$VPS_APP_DIR" | grep -Eq '^/[A-Za-z0-9._/-]+$'
          printf '%s' "$COMPOSE_PROJECT_NAME" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9_-]*$'
          printf '%s' "$VPS_SSH_PORT" | grep -Eq '^[0-9]+$'
          test "$VPS_SSH_PORT" -ge 1 && test "$VPS_SSH_PORT" -le 65535
          test "$OWNER_APPROVED" = true
          test "$TARGET" = iran || test "$TARGET" = germany
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          # Reviewed target arguments expand locally; remote variables are escaped.
          # shellcheck disable=SC2029
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      - name: Pin regional VPS host key
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          if ! ssh-keygen -F "[$VPS_HOST]:$VPS_SSH_PORT" -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1; then
            echo 'Pinned host key for configured host and port is missing' >&2
            exit 1
          fi
          printf '%s\n' \
            'Host *' \
            '  BatchMode yes' \
            '  StrictHostKeyChecking yes' \
            "  UserKnownHostsFile $HOME/.ssh/known_hosts" \
            '  GlobalKnownHostsFile /dev/null' \
            '  ConnectionAttempts 1' \
            '  ConnectTimeout 10' > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
      - name: Prepare immutable candidate contract directory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          release_dir="$VPS_APP_DIR/releases/$IMAGE_TAG"
          remote_contract="$release_dir/compose.prod.$TARGET.yaml"
          # Reviewed target arguments expand locally; remote variables are escaped.
          # shellcheck disable=SC2029
          ssh -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" \
            "set -eu; if [ -f '$VPS_APP_DIR/.regional-$TARGET-active-contract' ]; then active=\$(cat '$VPS_APP_DIR/.regional-$TARGET-active-contract'); test \"\$active\" != '$remote_contract'; else test '$INITIAL_DEPLOY' = true; fi; mkdir -p '$release_dir/ops'"
          scp -P "$VPS_SSH_PORT" "compose.prod.$TARGET.yaml" "$VPS_USER@$VPS_HOST:$remote_contract"
          scp -P "$VPS_SSH_PORT" Caddyfile "$VPS_USER@$VPS_HOST:$release_dir/Caddyfile"
          # Reviewed target arguments expand locally; remote variables are escaped.
          # shellcheck disable=SC2029
          ssh -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$release_dir/ops/redis'"
          scp -P "$VPS_SSH_PORT" ops/redis/redis.conf "$VPS_USER@$VPS_HOST:$release_dir/ops/redis/redis.conf"
          scp -P "$VPS_SSH_PORT" ops/deploy-regional.sh "$VPS_USER@$VPS_HOST:$release_dir/ops/deploy-regional.sh"
          scp -P "$VPS_SSH_PORT" ops/verify-regional.sh "$VPS_USER@$VPS_HOST:$release_dir/ops/verify-regional.sh"
          scp -P "$VPS_SSH_PORT" ops/backup-production.sh "$VPS_USER@$VPS_HOST:$release_dir/backup-production.sh"
          scp -P "$VPS_SSH_PORT" ops/check-db-connection-budget.py "$VPS_USER@$VPS_HOST:$release_dir/ops/check-db-connection-budget.py"
          scp -P "$VPS_SSH_PORT" ops/check-runtime-capacity.py "$VPS_USER@$VPS_HOST:$release_dir/ops/check-runtime-capacity.py"
          scp -P "$VPS_SSH_PORT" ops/rolling-backend.py "$VPS_USER@$VPS_HOST:$release_dir/ops/rolling-backend.py"
      - name: Authenticate regional Docker client
        if: needs.normalize-request.outputs.image_source == 'registry'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_TOKEN"
          # Reviewed target arguments expand locally; remote variables are escaped.
          # shellcheck disable=SC2029
          printf '%s' "$DOCKERHUB_TOKEN" | ssh -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" \
            "docker login --username '$DOCKERHUB_USERNAME' --password-stdin"
      - name: Read running regional baseline
        id: baseline
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          release_dir="$VPS_APP_DIR/releases/$IMAGE_TAG"
          # Reviewed target arguments expand locally; remote variables are escaped.
          # shellcheck disable=SC2029
          tag=$(ssh -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" \
            "REGION='$TARGET' DEPLOY_KIND='$DEPLOY_KIND' IMAGE_TAG='$IMAGE_TAG' APP_DIR='$VPS_APP_DIR' RELEASE_DIR='$release_dir' COMPOSE_FILE='$release_dir/compose.prod.$TARGET.yaml' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' FITICIAN_ENV_FILE='$VPS_APP_DIR/.env' OWNER_APPROVED=true IMAGE_SOURCE='$IMAGE_SOURCE' INITIAL_DEPLOY='$INITIAL_DEPLOY' FIRST_SCALABILITY_RELEASE_APPROVED='$FIRST_SCALABILITY_RELEASE_APPROVED' SCALABILITY_EVIDENCE_RUN_ID='$SCALABILITY_EVIDENCE_RUN_ID' INSPECT_ONLY=true bash '$release_dir/ops/deploy-regional.sh'")
          printf '%s' "$tag" | grep -Eq '^[0-9a-f]{40}$'
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Read running worker source baseline
        id: worker-baseline
        if: needs.normalize-request.outputs.target == 'iran' && needs.normalize-request.outputs.deploy_kind == 'backend'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          release_dir="$VPS_APP_DIR/releases/$IMAGE_TAG"
          # shellcheck disable=SC2029
          tag=$(ssh -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" \
            "REGION='$TARGET' DEPLOY_KIND='$DEPLOY_KIND' IMAGE_TAG='$IMAGE_TAG' APP_DIR='$VPS_APP_DIR' RELEASE_DIR='$release_dir' COMPOSE_FILE='$release_dir/compose.prod.$TARGET.yaml' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' FITICIAN_ENV_FILE='$VPS_APP_DIR/.env' OWNER_APPROVED=true IMAGE_SOURCE='$IMAGE_SOURCE' INITIAL_DEPLOY='$INITIAL_DEPLOY' FIRST_SCALABILITY_RELEASE_APPROVED='$FIRST_SCALABILITY_RELEASE_APPROVED' SCALABILITY_EVIDENCE_RUN_ID='$SCALABILITY_EVIDENCE_RUN_ID' INSPECT_ONLY=true INSPECT_ROLE=worker bash '$release_dir/ops/deploy-regional.sh'")
          printf '%s' "$tag" | grep -Eq '^[0-9a-f]{40}$'
          echo "worker_tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Read both running API replicas for protected frontend contract refresh
        id: frontend-api-baseline
        if: needs.normalize-request.outputs.frontend_contract_refresh == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          release_dir="$VPS_APP_DIR/releases/$IMAGE_TAG"
          # deploy-regional inspects both replicas and refuses mixed running API SHAs.
          # shellcheck disable=SC2029
          tag=$(ssh -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" \
            "REGION='$TARGET' DEPLOY_KIND=frontend IMAGE_TAG='$IMAGE_TAG' APP_DIR='$VPS_APP_DIR' RELEASE_DIR='$release_dir' COMPOSE_FILE='$release_dir/compose.prod.$TARGET.yaml' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' FITICIAN_ENV_FILE='$VPS_APP_DIR/.env' OWNER_APPROVED=true IMAGE_SOURCE='$IMAGE_SOURCE' INSPECT_ONLY=true INSPECT_ROLE=api bash '$release_dir/ops/deploy-regional.sh'")
          printf '%s' "$tag" | grep -Eq '^[0-9a-f]{40}$'
          echo "api_tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify cumulative component scope
        if: needs.normalize-request.outputs.deploy_kind == 'frontend' || needs.normalize-request.outputs.deploy_kind == 'backend' || needs.normalize-request.outputs.deploy_kind == 'agent'
        env:
          BASE_TAG: ${{ steps.baseline.outputs.tag }}
          WORKER_BASE_TAG: ${{ steps.worker-baseline.outputs.worker_tag }}
          GH_TOKEN: ${{ github.token }}
          AUTO_RELEASE: ${{ needs.normalize-request.outputs.auto_release }}
          FRONTEND_API_BASE: ${{ steps.frontend-api-baseline.outputs.api_tag }}
        run: |
          set -euo pipefail
          args=(--component "$DEPLOY_KIND" --base "$BASE_TAG" --head "$IMAGE_TAG")
          case "$DEPLOY_KIND" in
            backend)
              printf '%s' "$WORKER_BASE_TAG" | grep -Eq '^[0-9a-f]{40}$'
              args+=(--worker-base "$WORKER_BASE_TAG" \
                --validated-tests "$CI_BACKEND_TESTS" --shared-validated "$CI_SHARED_VALIDATED") ;;
            agent)
              args+=(--full-agent-validated)
              if [ "$AUTO_RELEASE" = true ]; then args+=(--auto-agent); fi ;;
            frontend)
              if [ "$FRONTEND_CONTRACT_REFRESH" = true ]; then
                test "$AUTO_RELEASE" = false
                args+=(--full-ci-run-id "$CI_RUN_ID" --frontend-api-base "$FRONTEND_API_BASE")
              elif [ "$CI_RELEASE_PATH" = frontend-full ]; then
                args+=(--full-ci-run-id "$CI_RUN_ID")
              fi ;;
          esac
          python3 ops/check-component-release.py "${args[@]}"
      - name: Deploy, verify, and regionally roll back on failure
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          release_dir="$VPS_APP_DIR/releases/$IMAGE_TAG"
          # Reviewed target arguments expand locally; remote variables are escaped.
          # shellcheck disable=SC2029
          ssh -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" \
            "REGION='$TARGET' DEPLOY_KIND='$DEPLOY_KIND' IMAGE_TAG='$IMAGE_TAG' APP_DIR='$VPS_APP_DIR' RELEASE_DIR='$release_dir' COMPOSE_FILE='$release_dir/compose.prod.$TARGET.yaml' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' FITICIAN_ENV_FILE='$VPS_APP_DIR/.env' OWNER_APPROVED='$OWNER_APPROVED' ALLOW_SCHEMA_MIGRATIONS='$ALLOW_SCHEMA_MIGRATIONS' IMAGE_SOURCE='$IMAGE_SOURCE' INITIAL_DEPLOY='$INITIAL_DEPLOY' FIRST_SCALABILITY_RELEASE_APPROVED='$FIRST_SCALABILITY_RELEASE_APPROVED' SCALABILITY_EVIDENCE_RUN_ID='$SCALABILITY_EVIDENCE_RUN_ID' bash '$release_dir/ops/deploy-regional.sh'"
