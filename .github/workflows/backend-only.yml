name: Fitician Backend Only CI

on:
  workflow_call:
    inputs:
      domains:
        type: string
        required: true
      test_scope:
        type: string
        required: true
      base_sha:
        type: string
        required: true
      publish_image:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the verified backend API image only
        type: boolean
        default: false
      previous_image_tag:
        description: Optional expected current backend API SHA
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  manual-scope:
    if: github.event_name == 'workflow_dispatch' && inputs.domains == ''
    runs-on: ubuntu-latest
    outputs:
      backend_tests: ${{ steps.classify.outputs.backend_tests }}
      backend_domains: ${{ steps.classify.outputs.backend_domains }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require safe backend source changes
        id: classify
        run: |
          base=$(git rev-parse "${GITHUB_SHA}^")
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"
          python3 ops/ci-classify.py --base "$base" --output .ci-evidence/manual-plan.json
          python3 - <<'PY'
          import json
          plan = json.load(open('.ci-evidence/manual-plan.json'))
          if plan['path'] != 'backend':
              raise SystemExit('Use Full CI for this SHA; manual backend releases require safe backend-only changes')
          PY
      - name: Scan manual release for secrets
        run: npm run security:secrets

  backend-verification:
    name: Backend domain verification
    needs: manual-scope
    if: always() && !cancelled() && (needs.manual-scope.result == 'success' || needs.manual-scope.result == 'skipped')
    env:
      TEST_SCOPE: ${{ inputs.test_scope || needs.manual-scope.outputs.backend_tests }}
      DOMAINS: ${{ inputs.domains || needs.manual-scope.outputs.backend_domains }}
      BASE_SHA: ${{ inputs.base_sha || needs.manual-scope.outputs.base_sha }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fitician
          POSTGRES_PASSWORD: fitician
          POSTGRES_DB: fitician_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitician -d fitician_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --extra dev
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Create dedicated benchmark databases
        run: |
          uv run python - <<'PY'
          import psycopg
          from psycopg import sql

          with psycopg.connect(
              "postgresql://fitician:fitician@localhost:5432/postgres",
              autocommit=True,
          ) as connection:
              for database_name in ("fitician", "fitician_nutrition_audit"):
                  exists = connection.execute(
                      "SELECT 1 FROM pg_database WHERE datname = %s",
                      (database_name,),
                  ).fetchone()
                  if exists is None:
                      connection.execute(
                          sql.SQL("CREATE DATABASE {}").format(
                              sql.Identifier(database_name)
                          )
                      )
          PY
      - name: Migrate benchmark databases
        run: |
          DATABASE_URL=postgresql+psycopg://fitician:fitician@localhost:5432/fitician \
            uv run python -m alembic upgrade head
          DATABASE_URL=postgresql+psycopg://fitician:fitician@localhost:5432/fitician_nutrition_audit \
            uv run python -m alembic upgrade head
      - name: Seed nutrition benchmark database
        run: |
          DATABASE_URL=postgresql+psycopg://fitician:fitician@localhost:5432/fitician_nutrition_audit \
            uv run python -m scripts.seed_nutrition_benchmark
      - name: Seed workout benchmark database
        run: |
          DATABASE_URL=postgresql+psycopg://fitician:fitician@localhost:5432/fitician \
            uv run python -m app.exercises.seed
          DATABASE_URL=postgresql+psycopg://fitician:fitician@localhost:5432/fitician \
            uv run python -m scripts.seed_benchmark_catalog
          DATABASE_URL=postgresql+psycopg://fitician:fitician@localhost:5432/fitician \
            uv run python -m app.training_templates.seed
      - name: Backend test scope and critical regressions
        run: |
          uv run python - <<'PY'
          import json, os, subprocess
          suites = json.loads(os.environ['TEST_SCOPE'])
          print('Backend test scope:', '\n'.join(suites), flush=True)
          subprocess.run(['uv', 'run', 'pytest', *suites, '-q'], check=True)
          PY
        env:
          DATABASE_URL: postgresql+psycopg://fitician:fitician@localhost:5432/fitician
          TEST_DATABASE_URL: postgresql+psycopg://fitician:fitician@localhost:5432/fitician_test
          NUTRITION_AUDIT_DATABASE_URL: postgresql+psycopg://fitician:fitician@localhost:5432/fitician_nutrition_audit
      - name: Ruff, format, and domain typing regression checks
        run: python3 ../ops/check-backend-quality.py --base "$BASE_SHA" --domains "$DOMAINS"
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
      - name: Verify shared contracts
        if: github.event_name == 'workflow_dispatch' && inputs.domains == ''
        working-directory: .
        run: |
          npm ci
          npm run test:core
          npm run check:openapi
          npm run test:contracts
      - name: Current critical backend typing checks
        run: |
          uv run ruff check app/infrastructure app/cache app/rate_limits app/body_analysis app/scheduler app/observability app/resilience
          uv run mypy app/infrastructure app/cache app/rate_limits app/body_analysis app/scheduler app/observability app/resilience

  backend-image:
    name: Build, verify, and push backend image
    if: inputs.publish_image || (github.event_name == 'workflow_dispatch' && inputs.domains == '')
    needs: backend-verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fitician-backend:${{ github.sha }}
          cache-from: type=gha,scope=fitician-backend
          cache-to: type=gha,mode=max,scope=fitician-backend
      - name: Verify backend image imports and migration heads
        env:
          BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/fitician-backend:${{ github.sha }}
        run: |
          docker run --rm --network none "$BACKEND_IMAGE" python -c 'from app.main import create_app; assert create_app'
          docker run --rm --network none --entrypoint alembic "$BACKEND_IMAGE" heads
      - name: Push verified immutable backend image
        env:
          BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/fitician-backend:${{ github.sha }}
        run: docker push "$BACKEND_IMAGE"

  deploy-backend-production:
    if: github.event_name == 'workflow_dispatch' && inputs.domains == '' && inputs.deploy_production && github.ref == 'refs/heads/main'
    needs: [backend-image, manual-scope]
    uses: ./.github/workflows/deploy-component.yml
    with:
      component: backend
      image_tag: ${{ github.sha }}
      previous_image_tag: ${{ inputs.previous_image_tag || '' }}
      validated_tests: ${{ needs.manual-scope.outputs.backend_tests }}
      shared_validated: true
    secrets: inherit
