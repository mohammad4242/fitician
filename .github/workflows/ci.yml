name: Fitician CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fitician-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitician
          POSTGRES_PASSWORD: fitician
          POSTGRES_DB: fitician_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitician -d fitician_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --extra dev
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Create dedicated benchmark databases
        run: |
          uv run python - <<'PY'
          import psycopg
          from psycopg import sql

          with psycopg.connect(
              "postgresql://fitician:fitician@localhost:5432/postgres",
              autocommit=True,
          ) as connection:
              for database_name in ("fitician", "fitician_nutrition_audit"):
                  exists = connection.execute(
                      "SELECT 1 FROM pg_database WHERE datname = %s",
                      (database_name,),
                  ).fetchone()
                  if exists is None:
                      connection.execute(
                          sql.SQL("CREATE DATABASE {}").format(
                              sql.Identifier(database_name)
                          )
                      )
          PY
      - name: Migrate benchmark databases
        run: |
          DATABASE_URL=postgresql+psycopg://fitician:fitician@localhost:5432/fitician \
            uv run alembic upgrade head
          DATABASE_URL=postgresql+psycopg://fitician:fitician@localhost:5432/fitician_nutrition_audit \
            uv run alembic upgrade head
      - name: Seed nutrition benchmark database
        run: |
          DATABASE_URL=postgresql+psycopg://fitician:fitician@localhost:5432/fitician_nutrition_audit \
            uv run python -m scripts.seed_nutrition_benchmark
      - name: Seed workout benchmark database
        run: |
          DATABASE_URL=postgresql+psycopg://fitician:fitician@localhost:5432/fitician \
            uv run python -m app.exercises.seed
          DATABASE_URL=postgresql+psycopg://fitician:fitician@localhost:5432/fitician \
            uv run python -m scripts.seed_benchmark_catalog
          DATABASE_URL=postgresql+psycopg://fitician:fitician@localhost:5432/fitician \
            uv run python -m app.training_templates.seed
      - run: uv run pytest
        env:
          DATABASE_URL: postgresql+psycopg://fitician:fitician@localhost:5432/fitician
          TEST_DATABASE_URL: postgresql+psycopg://fitician:fitician@localhost:5432/fitician_test
          NUTRITION_AUDIT_DATABASE_URL: postgresql+psycopg://fitician:fitician@localhost:5432/fitician_nutrition_audit

  frontend:
    name: Frontend tests, lint, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - run: npm run test --workspace frontend
      - run: npm run lint --workspace frontend
      - run: npm run build --workspace frontend

  frontend-browser:
    name: Frontend browser regression (Chromium and WebKit)
    runs-on: ubuntu-latest
    needs: frontend
    env:
      E2E_DATABASE_URL: postgresql+psycopg://fitician:fitician@127.0.0.1:5432/fitician_e2e
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitician
          POSTGRES_PASSWORD: fitician
          POSTGRES_DB: fitician_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitician -d fitician_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: npm ci
      - run: uv sync --directory backend --frozen --extra dev
      - run: npm run build:core
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e --workspace frontend

  shared:
    name: Shared core and contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - run: npm ci
      - run: npm run test:core
      - run: npm run check:openapi
      - run: npm run test:contracts

  mobile:
    name: Mobile tests and validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - run: npm run test --workspace @fitician/mobile
      - run: npm run test:native --workspace @fitician/mobile
      - run: npm run test:mobile:foundation
      - run: npm run typecheck:mobile
      - run: npm run validate:mobile

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run prebuild --workspace @fitician/mobile -- --platform android --no-install
        env:
          CI: "1"
      - run: ./gradlew :app:assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: fitician-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies --workspace @fitician/mobile

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
      - run: npm run security:secrets

  production-contract:
    name: Production Compose and deployment checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose, Caddy, and deployment helpers
        run: |
          test ! -e .env
          printf 'DATABASE_URL=postgresql+psycopg://fitician:placeholder@db:5432/fitician\n' > .env
          trap 'rm -f .env' EXIT
          DOCKERHUB_USERNAME=example \
          IMAGE_TAG=0000000000000000000000000000000000000000 \
          POSTGRES_PASSWORD=placeholder \
          AGENT_SERVICE_TOKEN=placeholder \
          FITICIAN_DOMAIN=example.com \
            docker compose -f compose.prod.yaml config --quiet
          docker run --rm -e FITICIAN_DOMAIN=example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile
          sh -n ops/deploy-production.sh
          bash -n ops/backup-production.sh
          python3 -m unittest discover -s ops/tests -p 'test_*.py' -v

  container-images:
    name: Build and publish immutable production images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend
      - frontend-browser
      - shared
      - mobile
      - android
      - dependencies
      - secrets
      - production-contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Require public S3 media URL
        env:
          MEDIA_BASE: ${{ vars.VITE_MEDIA_PUBLIC_BASE_URL }}
        run: |
          case "$MEDIA_BASE" in
            https://*) ;;
            *) echo "VITE_MEDIA_PUBLIC_BASE_URL must be an HTTPS bucket base URL" >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error --head --max-time 20 \
            "${MEDIA_BASE%/}/public/landing/videos/landfilm.mp4" >/dev/null
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fitician-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fitician-backend:main
          cache-from: type=gha,scope=fitician-backend
          cache-to: type=gha,mode=max,scope=fitician-backend
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_MEDIA_PUBLIC_BASE_URL=${{ vars.VITE_MEDIA_PUBLIC_BASE_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fitician-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fitician-frontend:main
          cache-from: type=gha,scope=fitician-frontend
          cache-to: type=gha,mode=max,scope=fitician-frontend
      - name: Build and push Agent Service image
        uses: docker/build-push-action@v6
        with:
          context: ./agent-service
          file: ./agent-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fitician-agent:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fitician-agent:main
          cache-from: type=gha,scope=fitician-agent
          cache-to: type=gha,mode=max,scope=fitician-agent
      - name: Check published frontend image contents
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker run --rm --entrypoint sh "$DOCKERHUB_USERNAME/fitician-frontend:$IMAGE_TAG" -c '
            test -f /usr/share/nginx/html/index.html
            test -f /usr/share/nginx/html/exercises/exercise-placeholder.svg
            test -f /usr/share/nginx/html/pwa/icon-192.png
            test ! -e /usr/share/nginx/html/image\&videos/landing.mp4
          '
