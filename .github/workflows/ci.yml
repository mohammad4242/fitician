name: Fitician CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fitician-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fitician
          POSTGRES_PASSWORD: fitician
          POSTGRES_DB: fitician_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitician -d fitician_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --extra dev
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Create dedicated benchmark databases
        run: |
          uv run python - <<'PY'
          import psycopg
          from psycopg import sql

          with psycopg.connect(
              "postgresql://fitician:fitician@localhost:5432/postgres",
              autocommit=True,
          ) as connection:
              for database_name in ("fitician", "fitician_nutrition_audit"):
                  exists = connection.execute(
                      "SELECT 1 FROM pg_database WHERE datname = %s",
                      (database_name,),
                  ).fetchone()
                  if exists is None:
                      connection.execute(
                          sql.SQL("CREATE DATABASE {}").format(
                              sql.Identifier(database_name)
                          )
                      )
          PY
      - name: Migrate benchmark databases
        run: |
          DATABASE_URL=postgresql+psycopg://fitician:fitician@localhost:5432/fitician \
            uv run python -m alembic upgrade head
          DATABASE_URL=postgresql+psycopg://fitician:fitician@localhost:5432/fitician_nutrition_audit \
            uv run python -m alembic upgrade head
      - name: Seed nutrition benchmark database
        run: |
          DATABASE_URL=postgresql+psycopg://fitician:fitician@localhost:5432/fitician_nutrition_audit \
            uv run python -m scripts.seed_nutrition_benchmark
      - name: Seed workout benchmark database
        run: |
          DATABASE_URL=postgresql+psycopg://fitician:fitician@localhost:5432/fitician \
            uv run python -m app.exercises.seed
          DATABASE_URL=postgresql+psycopg://fitician:fitician@localhost:5432/fitician \
            uv run python -m scripts.seed_benchmark_catalog
          DATABASE_URL=postgresql+psycopg://fitician:fitician@localhost:5432/fitician \
            uv run python -m app.training_templates.seed
      - name: Run complete backend suite in fresh-process shards
        run: |
          mkdir -p ../artifacts/scalability
          rm -f ../artifacts/scalability/backend-test-manifest.txt
          for shard in 0 1 2 3; do
            uv run python ../ops/run-backend-test-shard.py \
              --total 4 --index "$shard" \
              --manifest ../artifacts/scalability/backend-test-manifest.txt
          done
        env:
          DATABASE_URL: postgresql+psycopg://fitician:fitician@localhost:5432/fitician
          TEST_DATABASE_URL: postgresql+psycopg://fitician:fitician@localhost:5432/fitician_test
          NUTRITION_AUDIT_DATABASE_URL: postgresql+psycopg://fitician:fitician@localhost:5432/fitician_nutrition_audit

  frontend:
    name: Frontend tests, lint, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - run: npm run test --workspace frontend
      - run: npm run lint --workspace frontend
      - run: npm run build --workspace frontend

  frontend-browser:
    name: Frontend browser regression (Chromium and WebKit)
    runs-on: ubuntu-latest
    needs: frontend
    env:
      E2E_DATABASE_URL: postgresql+psycopg://fitician:fitician@127.0.0.1:5432/fitician_e2e
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fitician
          POSTGRES_PASSWORD: fitician
          POSTGRES_DB: fitician_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitician -d fitician_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: npm ci
      - run: uv sync --directory backend --frozen --extra dev
      - run: npm run build:core
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e --workspace frontend

  shared:
    name: Shared core and contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - run: npm ci
      - run: npm run test:core
      - run: npm run check:openapi
      - run: npm run test:contracts

  mobile:
    name: Mobile tests and validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - run: npm run test --workspace @fitician/mobile
      - run: npm run test:native --workspace @fitician/mobile
      - run: npm run test:mobile:foundation
      - run: npm run typecheck:mobile
      - run: npm run validate:mobile

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run prebuild --workspace @fitician/mobile -- --platform android --no-install
        env:
          CI: "1"
      - run: ./gradlew :app:assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: fitician-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies --workspace @fitician/mobile

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
      - run: npm run security:secrets

  production-contract:
    name: Production Compose and deployment checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose, Caddy, and deployment helpers
        run: |
          test ! -e .env
          test ! -e backend/.env
          printf 'DATABASE_URL=postgresql+psycopg://fitician:placeholder@db:5432/fitician\n' > .env
          printf 'DATABASE_URL=postgresql+psycopg://fitician:placeholder@db:5432/fitician\n' > backend/.env
          trap 'rm -f .env backend/.env' EXIT
          DOCKERHUB_USERNAME=example \
          IMAGE_TAG=0000000000000000000000000000000000000000 \
          POSTGRES_PASSWORD=placeholder \
          REDIS_PASSWORD=placeholder \
          AGENT_SERVICE_TOKEN=placeholder \
          FITICIAN_DOMAIN=example.com \
            docker compose -f compose.prod.yaml config --quiet
          docker run --rm -e FITICIAN_DOMAIN=example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile
          sh -n ops/deploy-production.sh
          bash -n ops/backup-production.sh
          python3 -m unittest discover -s ops/tests -p 'test_*.py' -v

  scalability-contract:
    name: Scalability foundation contract checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fitician
          POSTGRES_PASSWORD: fitician
          POSTGRES_DB: fitician
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitician -d fitician"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --extra dev
      - name: Prepare safe Compose environment
        run: |
          test ! -e .env
          test ! -e ../.env
          printf 'DATABASE_URL=postgresql+psycopg://fitician:fitician@localhost:5432/fitician_test\n' > .env
          printf 'DATABASE_URL=postgresql+psycopg://fitician:fitician@localhost:5432/fitician_test\n' > ../.env
      - name: Verify Redis service
        run: |
          uv run python - <<'PY'
          import asyncio
          import redis.asyncio as redis

          async def main() -> None:
              client = redis.Redis(host="127.0.0.1", port=6379)
              try:
                  assert await client.ping() is True
              finally:
                  await client.aclose()

          asyncio.run(main())
          PY
      - name: Run fast distributed-foundation tests
        run: |
          uv run pytest \
            tests/cache/test_service.py \
            tests/infrastructure/test_redis.py \
            tests/infrastructure/test_rate_limiter.py \
            tests/observability/test_logging.py \
            tests/test_observability.py \
            tests/rate_limits/test_service.py -q
      - name: Validate typed scalability modules
        run: |
          uv run ruff check \
            app/infrastructure app/cache app/rate_limits app/body_analysis app/scheduler app/observability \
            app/resilience tests/cache/test_service.py tests/infrastructure \
            tests/observability/test_logging.py tests/resilience/test_policy.py
          uv run mypy app/infrastructure app/cache app/rate_limits app/body_analysis app/scheduler app/observability app/resilience
      - name: Validate migrations and worker imports
        run: |
          uv run python -m alembic heads
          python3 ../ops/check-db-connection-budget.py --replicas 2
          python3 ../ops/check-runtime-capacity.py --replicas 2
          uv run python -m compileall -q \
            app/body_analysis/worker.py \
            app/nutrition/food_photo_worker.py \
            app/notifications/worker.py \
            app/scheduler/worker.py
          uv run python -c "import app.body_analysis.worker, app.nutrition.food_photo_worker, app.notifications.worker, app.scheduler.worker"
          bash -n ../ops/load/run.sh ../ops/load/failure-drills.sh
          python3 -m py_compile ../ops/load/http_smoke.py
      - name: Validate local and production topology contracts
        working-directory: .
        run: |
          printf 'DATABASE_URL=postgresql+psycopg://fitician:placeholder@db:5432/fitician\n' > backend/.env
          trap 'rm -f backend/.env .env' EXIT
          printf 'DATABASE_URL=postgresql+psycopg://fitician:placeholder@db:5432/fitician\n' > .env
          docker compose -f compose.yaml -f compose.multi.yaml config --quiet
          REDIS_PASSWORD=placeholder GRAFANA_ADMIN_PASSWORD=placeholder \
            docker compose -f compose.yaml -f compose.observability.yaml config --quiet
          DOCKERHUB_USERNAME=example \
          IMAGE_TAG=0000000000000000000000000000000000000000 \
          POSTGRES_PASSWORD=placeholder \
          REDIS_PASSWORD=placeholder \
          GRAFANA_ADMIN_PASSWORD=placeholder \
          AGENT_SERVICE_TOKEN=placeholder \
          FITICIAN_DOMAIN=example.com \
            docker compose -f compose.prod.yaml -f compose.observability.yaml config --quiet
          docker run --rm \
            -v "$PWD/Caddyfile.multi.yaml:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile
          python3 -m unittest discover -s ops/tests -p 'test_*.py' -v

  multi-replica-smoke:
    name: Short two-replica runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: scalability-contract
    steps:
      - uses: actions/checkout@v4
      - name: Prepare provider-free local configuration
        run: |
          mkdir -p artifacts/scalability
          docker volume create fitician_fitician_postgres_data
          printf '%s\n' 'AGENT_SERVICE_TOKEN=fitician-ci-agent-token-placeholder-000000' > .env
          printf '%s\n' \
            'DATABASE_URL=postgresql+psycopg://fitician:fitician@db:5432/fitician' \
            'APP_ENV=local' \
            'COOKIE_SECURE=false' \
            'SESSION_COOKIE_NAME=fitician_session' \
            'AGENT_SERVICE_TOKEN=fitician-ci-agent-token-placeholder-000000' \
            'EMAIL_PROVIDER=fake' \
            'SMS_PROVIDER=fake' \
            'BODY_ANALYSIS_LOCAL_FAKE_PROVIDER_ENABLED=true' \
            > backend/.env
      - name: Start required two-replica topology
        run: >-
          docker compose -f compose.yaml -f compose.multi.yaml up -d --build --wait
          db redis agent-service backend backend-2 caddy
      - name: Prove distribution and one-replica survival
        run: bash ops/load/ci-multi-replica-smoke.sh | tee artifacts/scalability/ci-multi-replica-smoke.json
      - name: Capture runtime evidence
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.multi.yaml ps > artifacts/scalability/ci-compose-ps.txt
          docker compose -f compose.yaml -f compose.multi.yaml logs --no-color \
            backend backend-2 caddy > artifacts/scalability/ci-compose.log
      - name: Upload multi-replica smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitician-ci-multi-replica-${{ github.run_id }}
          path: artifacts/scalability
          if-no-files-found: error
          retention-days: 14
      - name: Stop local topology without deleting volumes
        if: always()
        run: docker compose -f compose.yaml -f compose.multi.yaml down

  container-images:
    name: Build and publish immutable production images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend
      - frontend-browser
      - shared
      - mobile
      - android
      - dependencies
      - secrets
      - production-contract
      - scalability-contract
      - multi-replica-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Require public S3 media URL
        env:
          MEDIA_BASE: ${{ vars.VITE_MEDIA_PUBLIC_BASE_URL }}
        run: |
          case "$MEDIA_BASE" in
            https://*) ;;
            *) echo "VITE_MEDIA_PUBLIC_BASE_URL must be an HTTPS bucket base URL" >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error --head --max-time 20 \
            "${MEDIA_BASE%/}/public/landing/videos/landfilm.mp4" >/dev/null
      - name: Mask Google web client ID
        env:
          GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: echo "::add-mask::$GOOGLE_CLIENT_ID"
      - name: Require Google web client ID
        env:
          GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$(printf '%s' "$GOOGLE_CLIENT_ID" | tr -d '[:space:]')" ]; then
            echo "VITE_GOOGLE_CLIENT_ID is required for production Google Sign-In" >&2
            exit 1
          fi
          case "$GOOGLE_CLIENT_ID" in
            *.apps.googleusercontent.com) ;;
            *)
              echo "VITE_GOOGLE_CLIENT_ID must look like a Google OAuth client ID" >&2
              exit 1
              ;;
          esac
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fitician-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fitician-backend:main
          cache-from: type=gha,scope=fitician-backend
          cache-to: type=gha,mode=max,scope=fitician-backend
      - name: Build frontend image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          load: true
          build-args: |
            VITE_MEDIA_PUBLIC_BASE_URL=${{ vars.VITE_MEDIA_PUBLIC_BASE_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fitician-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fitician-frontend:main
          cache-from: type=gha,scope=fitician-frontend
          cache-to: type=gha,mode=max,scope=fitician-frontend
      - name: Check built frontend image contents
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
          EXPECTED_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          docker run --rm --entrypoint sh -e EXPECTED_GOOGLE_CLIENT_ID \
            "$DOCKERHUB_USERNAME/fitician-frontend:$IMAGE_TAG" -c '
              test -f /usr/share/nginx/html/index.html
              test -f /usr/share/nginx/html/exercises/exercise-placeholder.svg
              test -f /usr/share/nginx/html/pwa/icon-192.png
              test ! -e /usr/share/nginx/html/image\&videos/landing.mp4
              grep -R -F -- "$EXPECTED_GOOGLE_CLIENT_ID" /usr/share/nginx/html/assets >/dev/null
            '
      - name: Push verified frontend image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$DOCKERHUB_USERNAME/fitician-frontend:$IMAGE_TAG"
          docker push "$DOCKERHUB_USERNAME/fitician-frontend:main"
      - name: Build and push Agent Service image
        uses: docker/build-push-action@v6
        with:
          context: ./agent-service
          file: ./agent-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fitician-agent:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fitician-agent:main
          cache-from: type=gha,scope=fitician-agent
          cache-to: type=gha,mode=max,scope=fitician-agent
