name: Fitician local scalability checks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 6"

permissions:
  contents: read

jobs:
  local-resilience:
    name: Local multi-replica load and failure drills
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare local-only configuration
        run: |
          mkdir -p artifacts/scalability
          docker volume create fitician_fitician_postgres_data
          printf '%s\n' 'AGENT_SERVICE_TOKEN=fitician-ci-agent-token-placeholder-000000' > .env
          printf '%s\n' \
            'DATABASE_URL=postgresql+psycopg://fitician:fitician@db:5432/fitician' \
            'APP_ENV=local' \
            'COOKIE_SECURE=false' \
            'SESSION_COOKIE_NAME=fitician_session' \
            'EMAIL_PROVIDER=fake' \
            'SMS_PROVIDER=fake' \
            'BODY_ANALYSIS_LOCAL_FAKE_PROVIDER_ENABLED=true' \
            > backend/.env
      - name: Start two-replica local topology
        run: docker compose -f compose.yaml -f compose.multi.yaml up -d --build --wait
      - name: Seed authenticated catalogue smoke member
        run: |
          member=$(docker compose -f compose.yaml -f compose.multi.yaml exec -T backend \
            python -m app.jobs.local_acceptance seed-catalogue-member)
          member_id=$(MEMBER="$member" python3 -c 'import json, os; print(json.loads(os.environ["MEMBER"])["user_id"])')
          cookie_name=$(MEMBER="$member" python3 -c 'import json, os; print(json.loads(os.environ["MEMBER"])["session_cookie_name"])')
          session_token=$(MEMBER="$member" python3 -c 'import json, os; print(json.loads(os.environ["MEMBER"])["session_token"])')
          echo "::add-mask::$session_token"
          printf 'LOAD_MEMBER_ID=%s\n' "$member_id" >> "$GITHUB_ENV"
          printf 'LOAD_COOKIE=%s=%s\n' "$cookie_name" "$session_token" >> "$GITHUB_ENV"
      - name: Run percentile smoke scenarios
        run: |
          set -euo pipefail
          BASE_URL=http://127.0.0.1:8080 LOAD_REQUESTS=100 LOAD_CONCURRENCY=10 \
            bash ops/load/run.sh health | tee artifacts/scalability/health.json
          BASE_URL=http://127.0.0.1:8080 LOAD_REQUESTS=200 LOAD_CONCURRENCY=20 LOAD_WARMUP_REQUESTS=20 \
            bash ops/load/run.sh catalogue | tee artifacts/scalability/catalogue.json
      - name: Clean up authenticated catalogue smoke member
        if: always()
        run: |
          if [ -n "${LOAD_MEMBER_ID:-}" ]; then
            docker compose -f compose.yaml -f compose.multi.yaml exec -T backend \
              python -m app.jobs.local_acceptance cleanup-member --user-id "$LOAD_MEMBER_ID" || true
          fi
      - name: Run bounded failure drills
        run: |
          set -euo pipefail
          BASE_URL=http://127.0.0.1:8080 FAILURE_DRILL_DEADLINE_SECONDS=150 \
            FAILURE_DRILL_BACKLOG_MAX_DRAIN_SECONDS=90 \
            bash ops/load/failure-drills.sh all | tee artifacts/scalability/failure-drills.jsonl
      - name: Capture topology evidence
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.multi.yaml ps > artifacts/scalability/ps.txt
          docker compose -f compose.yaml -f compose.multi.yaml logs --no-color > artifacts/scalability/compose.log
      - name: Upload scalability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitician-scalability-${{ github.run_id }}
          path: artifacts/scalability
          if-no-files-found: error
          retention-days: 14
      - name: Stop local topology without deleting volumes
        if: always()
        run: docker compose -f compose.yaml -f compose.multi.yaml down
