name: Fitician Android release

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS release profile
        required: true
        type: choice
        default: preview
        options:
          - development
          - preview
          - production-device
          - production

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.profile }} Android artifact
    runs-on: ubuntu-latest
    environment: ${{ inputs.profile == 'production-device' && 'production' || inputs.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
      - run: npm ci
      - name: Build signed EAS artifact
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          FITICIAN_EAS_ENVIRONMENT: ${{ inputs.profile == 'production-device' && 'production' || inputs.profile }}
        run: |
          case "${{ inputs.profile }}" in
            development) build_script=build:android:debug ;;
            preview) build_script=build:android:internal ;;
            production-device) build_script=build:android:production-device ;;
            production) build_script=build:android:production ;;
            *) echo "Unsupported release profile" >&2; exit 2 ;;
          esac
          npx --yes eas-cli@latest env:exec \
            "$FITICIAN_EAS_ENVIRONMENT" \
            "npm run $build_script" \
            --non-interactive
