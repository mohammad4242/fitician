services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: fitician
      POSTGRES_PASSWORD: fitician
      POSTGRES_DB: fitician
    ports:
      - "5432:5432"
    volumes:
      - fitician_postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitician -d fitician"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-fitician-redis-local-change-me}
    command:
      - sh
      - -c
      - exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$${REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - fitician_redis_data:/data
      - ./ops/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 192m
    restart: unless-stopped

  agent-service:
    build:
      context: ./agent-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:-}
      HOME: /home/agent
      AGENT_SHARED_PRIVATE_MEDIA_ROOT: /shared-private-media
      NO_PROXY: ${AGENT_NO_PROXY:-agent-service,db,localhost,127.0.0.1}
      AGENT_WORKSPACE_ROOT: /tmp/fitician-agent
      AGENT_AUTH_SESSION_TTL_SECONDS: ${AGENT_AUTH_SESSION_TTL_SECONDS:-600}
      AGENT_AUTH_MAX_OUTPUT_BYTES: ${AGENT_AUTH_MAX_OUTPUT_BYTES:-65536}
      AGENT_ANTIGRAVITY_MODELS: ${AGENT_ANTIGRAVITY_MODELS:-[]}
      AGENT_ANTIGRAVITY_SUPPORTS_IMAGE_INPUT: ${AGENT_ANTIGRAVITY_SUPPORTS_IMAGE_INPUT:-true}
      AGENT_CODEX_MODELS: ${AGENT_CODEX_MODELS:-[]}
      AGENT_CODEX_SUPPORTS_IMAGE_INPUT: ${AGENT_CODEX_SUPPORTS_IMAGE_INPUT:-true}
      AGENT_CLAUDE_MODELS: ${AGENT_CLAUDE_MODELS:-[]}
      AGENT_CLAUDE_SUPPORTS_IMAGE_INPUT: ${AGENT_CLAUDE_SUPPORTS_IMAGE_INPUT:-false}
    expose:
      - "9001"
    volumes:
      - fitician_agent_home:/home/agent
      - ./backend/var/private/body-photos:/shared-private-media/body:ro
      - ./backend/var/private/food-photos:/shared-private-media/food:ro
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://fitician:fitician@db:5432/fitician
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-fitician-redis-local-change-me}
      FRONTEND_ORIGIN: http://localhost:5173
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://10.120.36.22:5173,http://100.97.78.5:5173}
      APP_ENV: local
      COOKIE_SECURE: "false"
      SESSION_COOKIE_NAME: fitician_session
      MEDIA_ROOT: /var/lib/fitician/media
      MEDIA_PUBLIC_PATH: /media
      MEDIA_MAX_BYTES: "20971520"
      MEDIA_MAX_VIDEO_BYTES: "67108864"
      MEDIA_MAX_VIDEO_DURATION_SECONDS: "20"
      BODY_PHOTO_STORAGE_ROOT: /var/lib/fitician/private/body-photos
      PROFILE_PHOTO_STORAGE_ROOT: /var/lib/fitician/private/profile-photos
      FOOD_PHOTO_STORAGE_ROOT: /var/lib/fitician/private/food-photos
      NUTRITION_LAB_STORAGE_ROOT: /var/lib/fitician/private/nutrition-labs
      AGENT_SERVICE_BASE_URL: http://agent-service:9001
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:-}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-127.0.0.1,::1,172.16.0.0/12}
      NO_PROXY: agent-service,db,localhost,127.0.0.1
    ports:
      - "8001:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/var/media:/var/lib/fitician/media
      - ./backend/var/private/body-photos:/var/lib/fitician/private/body-photos
      - ./backend/var/private/profile-photos:/var/lib/fitician/private/profile-photos
      - ./backend/var/private/food-photos:/var/lib/fitician/private/food-photos
      - ./backend/var/private/nutrition-labs:/var/lib/fitician/private/nutrition-labs
      - fitician_exercise_media:/var/lib/fitician/media-legacy:ro
      - ./backend/var/media-migration:/app/var/media-migration
      - ./backend/var/media-migration-source:/var/lib/fitician/media-migration-source:ro
      - ./frontend/public/exercises:/var/lib/fitician/seed-exercises:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic upgrade head && python -m app.exercises.seed_media_sync --source-root /var/lib/fitician/seed-exercises && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips "$${TRUSTED_PROXY_IPS:-127.0.0.1,::1,172.16.0.0/12}"

  food-photo-worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://fitician:fitician@db:5432/fitician
      APP_ENV: local
      FOOD_PHOTO_STORAGE_ROOT: /var/lib/fitician/private/food-photos
      FOOD_PHOTO_WORKER_BATCH_SIZE: ${FOOD_PHOTO_WORKER_BATCH_SIZE:-5}
      FOOD_PHOTO_WORKER_POLL_SECONDS: ${FOOD_PHOTO_WORKER_POLL_SECONDS:-3}
      FOOD_PHOTO_WORKER_LEASE_SECONDS: ${FOOD_PHOTO_WORKER_LEASE_SECONDS:-600}
      FOOD_PHOTO_MAX_ATTEMPTS: ${FOOD_PHOTO_MAX_ATTEMPTS:-3}
      FOOD_PHOTO_RETRY_BASE_SECONDS: ${FOOD_PHOTO_RETRY_BASE_SECONDS:-30}
      FOOD_PHOTO_RETRY_MAX_SECONDS: ${FOOD_PHOTO_RETRY_MAX_SECONDS:-1800}
      AGENT_SERVICE_BASE_URL: http://agent-service:9001
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:-}
      NO_PROXY: agent-service,db,localhost,127.0.0.1
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/var/private/food-photos:/var/lib/fitician/private/food-photos
    depends_on:
      db:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic upgrade head && python -m app.nutrition.food_photo_worker
    restart: unless-stopped

  body-analysis-worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://fitician:fitician@db:5432/fitician
      APP_ENV: local
      BODY_PHOTO_STORAGE_ROOT: /var/lib/fitician/private/body-photos
      BODY_ANALYSIS_WORKER_BATCH_SIZE: ${BODY_ANALYSIS_WORKER_BATCH_SIZE:-1}
      BODY_ANALYSIS_WORKER_POLL_SECONDS: ${BODY_ANALYSIS_WORKER_POLL_SECONDS:-3}
      BODY_ANALYSIS_WORKER_LEASE_SECONDS: ${BODY_ANALYSIS_WORKER_LEASE_SECONDS:-900}
      AGENT_SERVICE_BASE_URL: http://agent-service:9001
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:-}
      NO_PROXY: agent-service,db,localhost,127.0.0.1
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/var/private/body-photos:/var/lib/fitician/private/body-photos:ro
    depends_on:
      db:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic upgrade head && python -m app.body_analysis.worker
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://fitician:fitician@db:5432/fitician
      APP_ENV: local
      FOOD_PHOTO_STORAGE_ROOT: /var/lib/fitician/private/food-photos
      NUTRITION_LAB_STORAGE_ROOT: /var/lib/fitician/private/nutrition-labs
      AGENT_SERVICE_BASE_URL: http://agent-service:9001
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:-}
      NO_PROXY: agent-service,db,localhost,127.0.0.1
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/var/private/food-photos:/var/lib/fitician/private/food-photos
      - ./backend/var/private/nutrition-labs:/var/lib/fitician/private/nutrition-labs
    depends_on:
      db:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic upgrade head && python -m app.scheduler.worker
    restart: unless-stopped

  notification-worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://fitician:fitician@db:5432/fitician
      APP_ENV: local
      NOTIFICATION_WORKER_BATCH_SIZE: ${NOTIFICATION_WORKER_BATCH_SIZE:-100}
      NOTIFICATION_WORKER_POLL_SECONDS: ${NOTIFICATION_WORKER_POLL_SECONDS:-5}
      NOTIFICATION_WORKER_LEASE_SECONDS: ${NOTIFICATION_WORKER_LEASE_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic upgrade head && python -m app.notifications.worker
    restart: unless-stopped

volumes:
  fitician_postgres_data:
    external: true
    name: fitician_fitician_postgres_data
  fitician_exercise_media:
  fitician_agent_home:
  fitician_redis_data:
