global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fitician-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000
          - backend-2:8000
        labels:
          service: backend
  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          service: redis

