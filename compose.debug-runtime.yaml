# Independent Germany project. Never combine with generation/application Compose.
services:
  connector:
    image: ${FITICIAN_DEBUG_RUNTIME_IMAGE:?Set the tested immutable runtime image digest}
    pull_policy: never
    init: true
    user: '10001:10001'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 96
    mem_limit: 512m
    memswap_limit: 768m
    cpus: 0.25
    stop_grace_period: 30s
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700,size=32m
    volumes:
      - '${FITICIAN_DEBUG_RUNTIME_ROOT:?Set the dedicated runtime root}/state:/state'
      - '${FITICIAN_DEBUG_RUNTIME_ROOT}/private:/run/fitician-connector:ro'
    networks: [debug-runtime]
    healthcheck:
      # Liveness only. Read status.json for enrollment/authentication/readiness.
      test: [CMD, python, -m, app.debugging.server_runtime, health]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    ulimits:
      core: 0
      nofile: 1024
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: '2'}
  automation:
    profiles: [automation]
    image: ${FITICIAN_DEBUG_RUNTIME_IMAGE:?Set the tested immutable runtime image digest}
    pull_policy: never
    entrypoint: [python, -m, app.debugging.automation_client]
    command: [serve]
    init: true
    user: '10001:10001'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 192m
    cpus: 0.1
    stop_grace_period: 30s
    tmpfs: [/tmp:uid=10001,gid=10001,mode=0700,size=16m]
    volumes:
      - '${FITICIAN_DEBUG_RUNTIME_ROOT}/automation-state:/state'
      - '${FITICIAN_DEBUG_RUNTIME_ROOT}/automation-private:/run/fitician-automation:ro'
    networks: [debug-runtime]
    healthcheck:
      test: [CMD, python, -m, app.debugging.automation_client, health]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: '2'}
networks:
  debug-runtime:
    driver: bridge
