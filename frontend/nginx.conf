server {
    listen 80;
    server_name _;
    absolute_redirect off;
    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/css application/json application/xml image/svg+xml;
    root /usr/share/nginx/html;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        gzip off;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /media/ {
        gzip off;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /exercises/exercise-placeholder.svg {
        try_files $uri =404;
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
        try_files $uri =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-cache" always;
    }

    # Stable precache URL; returned HTML canonicals point to the homepage.
    location = /index.html { try_files /index.html =404; add_header Cache-Control "no-cache"; }
    location ~ ^/(.+)/index\.html$ { return 308 /$1; }

    location = /app.html {
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-cache" always;
    }

    location = /nginx-member-routes.conf { return 404; }
    location ~ ^/(?:api|media)$ { return 404; }
    location ~ ^/(?:assets|pwa|mediapipe)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ \.(?:js|css|png|jpg|jpeg|webp|gif|svg|woff2?|json|xml|txt|ico|webmanifest)$ {
        try_files $uri =404;
    }

    location ~ ^/(?:fitician|fitsho)_.*report.*\.html$ { return 404; }
    location ~ ^/workout_engine_.*\.html$ { return 404; }

    include /etc/nginx/conf.d/member-routes.inc;

    location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri/index.html $uri =404;
    }
}
