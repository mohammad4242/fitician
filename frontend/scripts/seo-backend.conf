server {
    listen 8000;
    location = /api/v1/auth/me { default_type application/json; return 401 '{"detail":"UNAUTHENTICATED"}'; }
    location = /api/v1/campaigns/signup/active { default_type application/json; return 200 'null'; }
    location = /api/seo-fixture.json { default_type application/json; return 200 '{"source":"backend"}'; }
    location = /media/seo-fixture.gif { default_type image/gif; return 200 "backend-media"; }
    location / { return 404; }
}
